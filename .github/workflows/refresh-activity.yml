name: Refresh activity asset

on:
  schedule:
    # Weekly, Monday 04:17 UTC.
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: refresh-activity
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate activity asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_activity.py

      - name: Validate SVG
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          tree = ET.parse("assets/activity.svg")
          root = tree.getroot()
          assert root.tag.endswith("svg"), root.tag
          assert root.get("viewBox") == "0 0 1200 360", root.get("viewBox")
          assert root.find("{http://www.w3.org/2000/svg}title") is not None
          print("assets/activity.svg is well-formed")
          PY

      - name: Commit only when the asset changed
        run: |
          if git diff --quiet -- assets/activity.svg; then
            echo "No change in assets/activity.svg; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          git commit -m "chore: refresh GitHub activity asset"
          git push
