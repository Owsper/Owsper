<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-labelledby="footerTitle footerDesc">
  <title id="footerTitle">OWSPER signature</title>
  <desc id="footerDesc">A thin arc over a horizon line with the OWSPER wordmark and the year the GitHub account was created.</desc>
  <defs>
    <linearGradient id="footLine" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f4f4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f4f4f4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f4f4f4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="footArc" x1="820" y1="0" x2="1110" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4f4f4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f4f4f4" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="140" fill="#080808"/>
  <line x1="0" y1="0.5" x2="1200" y2="0.5" stroke="url(#footLine)"/>
  <line x1="0" y1="99.5" x2="1200" y2="99.5" stroke="#1e1e1e"/>

  <g aria-hidden="true">
    <path d="M842 92 A 168 168 0 0 1 1112 36" fill="none" stroke="url(#footArc)" stroke-width="1"/>
    <circle cx="1112" cy="36" r="1.8" fill="#cfcfcf"/>
    <line x1="56" y1="70" x2="96" y2="70" stroke="#6f6f6f" stroke-width="1"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace">
    <text x="56" y="94" font-size="10.5" letter-spacing="5.4" fill="#d0d0d0">OWSPER</text>
    <text x="56" y="120" font-size="8.5" letter-spacing="2.8" fill="#565656">SOFTWARE · SYSTEMS · MACHINE PERCEPTION</text>
    <text x="1144" y="94" font-size="9" letter-spacing="3" fill="#6a6a6a" text-anchor="end">EST. 2022</text>
    <text x="1144" y="120" font-size="8.5" letter-spacing="2.6" fill="#4f4f4f" text-anchor="end">GITHUB.COM/OWSPER</text>
  </g>
</svg>
